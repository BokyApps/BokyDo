packages:
  - apps/*
  - packages/*

# --- Supply-chain hardening ---------------------------------------------------------------------
# Only these packages may run install scripts.
allowBuilds:
  esbuild: true
# Don't install versions published less than 7 days ago (time for hijacked releases to be caught).
minimumReleaseAge: 10080
# Transitive deps may only come from the registry (no git/tarball URLs).
blockExoticSubdeps: true
# Refuse updates whose publish provenance is weaker than earlier versions.
trustPolicy: no-downgrade
# Downgrade checks target fresh hijacks; long-lived releases (often pre-provenance) are exempt.
trustPolicyIgnoreAfter: 43200

strictPeerDependencies: true

overrides:
  # drizzle-kit → @esbuild-kit pins esbuild 0.18 (GHSA-67mh-4wv8-2f99). Dev-only, but keep audits clean.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  # F-029 (GHSA-68fv-2mgg-jv7q): Vite/PostCSS pin 1.2.1. Build-time only; keep audits clean.
  source-map-js: ^1.2.2
