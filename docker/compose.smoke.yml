# Overrides for docker/smoke-test.sh: loopback-only port and an SMTP sink to verify email.
services:
  app:
    ports: !override
      - '127.0.0.1:${PORT:-18080}:8080'

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    networks: [egress]
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-18025}:8025'
